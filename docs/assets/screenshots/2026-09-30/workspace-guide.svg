<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1030" viewBox="0 0 1440 1030" role="img" aria-labelledby="title desc">
  <title id="title">MModels 无对话工作台功能导览</title>
  <desc id="desc">以刚打开且尚未开始对话的工作台为底图，用橙色虚线框和箭头解释项目入口、建模导航、项目树、主工作区、输入区、多智能体协作、模型选择和快捷技能。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#f0643a"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#18243b" flood-opacity=".18"/></filter>
    <style>
      .label{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;fill:#18243b}
      .title{font-size:24px;font-weight:800}.subtitle{font-size:13px;fill:#617089}
      .legend{font-size:12px;font-weight:700}.legend-small{font-size:11px;fill:#617089}
      .call{font-size:13px;font-weight:800}.call-small{font-size:11px;fill:#4c5c73}
      .box{fill:#ff78400d;stroke:#f0643a;stroke-width:2;stroke-dasharray:8 6;rx:10}
      .line{fill:none;stroke:#f0643a;stroke-width:2;stroke-dasharray:6 5;marker-end:url(#arrow)}
      .tag{fill:#fff;stroke:#f0643a;stroke-width:1.5;rx:7;filter:url(#shadow)}
      .num{fill:#f0643a}.numtext{font-family:Arial,sans-serif;font-size:12px;font-weight:800;fill:#fff;text-anchor:middle}
    </style>
  </defs>
  <rect width="1440" height="1030" fill="#f6f8fb"/>
  <rect x="20" y="18" width="1400" height="94" rx="14" fill="#fff" stroke="#dce3ed"/>
  <text x="48" y="52" class="label title">MModels 工作台 · 无对话功能导览</text>
  <text x="48" y="78" class="label subtitle">打开软件后先看懂入口，再让智能体协作推进；橙色虚线框对应下方说明，箭头指向真实按钮或区域。</text>
  <g transform="translate(48 91)">
    <circle cx="6" cy="0" r="6" class="num"/><text x="18" y="4" class="label legend">项目与题目</text>
    <circle cx="150" cy="0" r="6" class="num"/><text x="162" y="4" class="label legend">建模导航</text>
    <circle cx="285" cy="0" r="6" class="num"/><text x="297" y="4" class="label legend">多智能体协作</text>
    <circle cx="452" cy="0" r="6" class="num"/><text x="464" y="4" class="label legend">模型与质量</text>
    <circle cx="600" cy="0" r="6" class="num"/><text x="612" y="4" class="label legend">数据、绘图与论文快捷技能</text>
  </g>
  <image href="workspace-idle.png" x="0" y="130" width="1440" height="900" preserveAspectRatio="none"/>

  <!-- ① 项目入口 -->
  <rect x="12" y="184" width="220" height="88" class="box"/>
  <path d="M234 214 C290 180 300 160 360 155" class="line"/>
  <g transform="translate(360 140)"><rect width="242" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">1</text><text x="38" y="20" class="label call">项目入口</text><text x="38" y="38" class="label call-small">新建项目 / 新建任务</text></g>

  <!-- ② 建模导航 -->
  <rect x="10" y="275" width="222" height="180" class="box"/>
  <path d="M234 336 C310 315 315 255 415 235" class="line"/>
  <g transform="translate(415 205)"><rect width="270" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">2</text><text x="38" y="20" class="label call">建模导航</text><text x="38" y="38" class="label call-small">对话 / 比赛 / 获奖论文</text></g>

  <!-- ③ 项目树 -->
  <rect x="10" y="454" width="222" height="250" class="box"/>
  <path d="M234 510 C330 490 340 400 475 330" class="line"/>
  <g transform="translate(475 302)"><rect width="290" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">3</text><text x="38" y="20" class="label call">项目树</text><text x="38" y="38" class="label call-small">题目、任务、文件和结果统一归档</text></g>

  <!-- ④ 主工作区 -->
  <rect x="240" y="130" width="1190" height="345" class="box"/>
  <path d="M990 475 C990 445 990 410 990 370" class="line"/>
  <g transform="translate(820 330)"><rect width="315" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">4</text><text x="38" y="20" class="label call">主工作区</text><text x="38" y="38" class="label call-small">对话、文件、工作流和结果的内容画布</text></g>

  <!-- ⑤ 输入与交付 -->
  <rect x="250" y="605" width="1170" height="160" class="box"/>
  <path d="M1060 765 C1060 790 1060 815 1060 845" class="line"/>
  <g transform="translate(880 846)"><rect width="350" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">5</text><text x="38" y="20" class="label call">输入与交付入口</text><text x="38" y="38" class="label call-small">附件、比赛信息、发送与项目上下文</text></g>

  <!-- ⑥ 多智能体 -->
  <rect x="292" y="725" width="250" height="38" class="box"/>
  <path d="M415 725 C415 700 420 680 465 650" class="line"/>
  <g transform="translate(460 612)"><rect width="280" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">6</text><text x="38" y="20" class="label call">多智能体协作</text><text x="38" y="38" class="label call-small">规划、数据、算法、绘图、论文并行</text></g>

  <!-- ⑦ 模型与质量 -->
  <rect x="1110" y="725" width="290" height="38" class="box"/>
  <path d="M1250 725 C1250 700 1220 680 1175 650" class="line"/>
  <g transform="translate(1080 612)"><rect width="275" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">7</text><text x="38" y="20" class="label call">模型与质量</text><text x="38" y="38" class="label call-small">模型、深度、访问权限和输出标准</text></g>

  <!-- ⑧ 快捷技能 -->
  <rect x="250" y="770" width="1170" height="122" class="box"/>
  <path d="M810 892 C810 910 810 930 810 950" class="line"/>
  <g transform="translate(650 950)"><rect width="430" height="48" class="tag"/><circle cx="18" cy="18" r="12" class="num"/><text x="18" y="22" class="numtext">8</text><text x="38" y="20" class="label call">快捷技能卡</text><text x="38" y="38" class="label call-small">找数据、数据体检、方法选型、求解、灵敏度、论文、图表、评审</text></g>
</svg>
