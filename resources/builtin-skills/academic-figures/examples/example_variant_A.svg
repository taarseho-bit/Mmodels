<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="183mm" height="145.0mm" viewBox="0 0 183 145.0" version="1.1">
  <sodipodi:namedview inkscape:document-units="mm" units="mm"/>

  <defs>
    <marker id="arrow-std" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#444444"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#0072B2"/>
    </marker>
  </defs>

  <rect width="183" height="145.0" fill="#FFFFFF"/>
  <g id="panel-a" inkscape:groupmode="layer" inkscape:label="Panel a - RLHF Pipeline">
    <text x="6" y="10.5" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#222222">a</text>
    <g id="rlhf-pipeline">
      <text x="91.5" y="17.5" font-family="Helvetica, Arial, sans-serif" font-size="2.4" fill="#222222" text-anchor="middle" font-weight="bold">RLHF Training Pipeline</text>
      <rect x="8.0" y="21.0" width="22.7" height="18.9" fill="#E3F2FD" stroke="#0072B2" stroke-width="0.35" rx="1.5"/>
      <text x="19.4" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Pre-trained</text>
      <text x="19.4" y="32.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">LLM</text>
      <rect x="44.1" y="21.0" width="22.7" height="18.9" fill="#FFF3E0" stroke="#E69F00" stroke-width="0.35" rx="1.5"/>
      <text x="55.5" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Supervised</text>
      <text x="55.5" y="32.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Fine-tuning</text>
      <rect x="80.2" y="21.0" width="22.7" height="18.9" fill="#E8F5E9" stroke="#009E73" stroke-width="0.35" rx="1.5"/>
      <text x="91.5" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Reward</text>
      <text x="91.5" y="32.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Model</text>
      <rect x="116.3" y="21.0" width="22.7" height="18.9" fill="#FCE4EC" stroke="#D55E00" stroke-width="0.35" rx="1.5"/>
      <text x="127.6" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">PPO</text>
      <text x="127.6" y="32.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Optimization</text>
      <rect x="152.4" y="21.0" width="22.7" height="18.9" fill="#F3E5F5" stroke="#CC79A7" stroke-width="0.35" rx="1.5"/>
      <text x="163.8" y="29.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Aligned</text>
      <text x="163.8" y="32.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">LLM</text>
    <line x1="32.7" y1="33.3" x2="42.1" y2="33.3" stroke="#0072B2" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <line x1="68.8" y1="33.3" x2="78.2" y2="33.3" stroke="#E69F00" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <line x1="104.9" y1="33.3" x2="114.3" y2="33.3" stroke="#009E73" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <line x1="141.0" y1="33.3" x2="150.4" y2="33.3" stroke="#D55E00" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
      <rect x="74.5" y="53.9" width="34.0" height="12.6" fill="#FCE4EC" stroke="#D55E00" stroke-width="0.35" rx="1.5"/>
      <text x="91.5" y="59.2" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#222222" text-anchor="middle">Human Feedback</text>
      <text x="91.5" y="62.4" font-family="Helvetica, Arial, sans-serif" font-size="1.8" fill="#888888" text-anchor="middle">Pairwise Rankings</text>
    <line x1="91.5" y1="51.9" x2="91.5" y2="41.9" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <path d="M 127.7 43.9 Q 124.1 51.9 110.5 60.2" fill="none" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
      <text x="127.1" y="70.0" font-family="Helvetica, Arial, sans-serif" font-size="1.8" fill="#888888" text-anchor="middle" font-style="italic">Generate responses</text>
      <text x="91.5" y="69.0" font-family="Helvetica, Arial, sans-serif" font-size="1.7" fill="#888888" text-anchor="middle">SFT: 50K examples  |  Reward: 100K comparisons  |  PPO: 500K episodes</text>
    </g>
  </g>
  <g id="panel-b" inkscape:groupmode="layer" inkscape:label="Panel b - Training Curves">
    <text x="6.0" y="88.5" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#222222">b</text>
    <g id="placeholder-training">
      <rect x="6.0" y="92.0" width="43.7" height="47.0"
            fill="#FAFAFA" stroke="#AAAAAA"
            stroke-width="0.3" stroke-dasharray="2.5,2" rx="1.5"/>
      <text x="27.9" y="112.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2.8" fill="#222222" text-anchor="middle" font-weight="bold">Training Curves</text>
      <text x="27.9" y="116.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2" fill="#888888" text-anchor="middle">Loss and reward vs. training steps</text>
      <text x="27.9" y="120.5" font-family="Helvetica, Arial, sans-serif"
            font-size="1.6" fill="#888888" text-anchor="middle" font-style="italic">[Import plot here]</text>
      <text x="47.7" y="137.0" font-family="Helvetica, Arial, sans-serif"
            font-size="1.3" fill="#AAAAAA" text-anchor="end">44×47 mm</text>
    </g>
  </g>
  <g id="panel-c" inkscape:groupmode="layer" inkscape:label="Panel c - Benchmark Comparison">
    <text x="69.7" y="88.5" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#222222">c</text>
    <g id="placeholder-benchmarks">
      <rect x="69.7" y="92.0" width="43.7" height="47.0"
