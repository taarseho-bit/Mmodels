            stroke-width="0.3" stroke-dasharray="2.5,2" rx="1.5"/>
      <text x="91.6" y="112.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2.8" fill="#222222" text-anchor="middle" font-weight="bold">Benchmark Comparison</text>
      <text x="91.6" y="116.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2" fill="#888888" text-anchor="middle">MMLU, GSM8K, HumanEval, TruthfulQA</text>
      <text x="91.6" y="120.5" font-family="Helvetica, Arial, sans-serif"
            font-size="1.6" fill="#888888" text-anchor="middle" font-style="italic">[Import plot here]</text>
      <text x="111.4" y="137.0" font-family="Helvetica, Arial, sans-serif"
            font-size="1.3" fill="#AAAAAA" text-anchor="end">44×47 mm</text>
    </g>
  </g>
  <g id="panel-d" inkscape:groupmode="layer" inkscape:label="Panel d - Human Evaluation">
    <text x="133.4" y="88.5" font-family="Helvetica, Arial, sans-serif" font-size="3.5" font-weight="bold" fill="#222222">d</text>
    <g id="placeholder-human-eval">
      <rect x="133.4" y="92.0" width="43.7" height="47.0"
            fill="#FAFAFA" stroke="#AAAAAA"
            stroke-width="0.3" stroke-dasharray="2.5,2" rx="1.5"/>
      <text x="155.2" y="112.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2.8" fill="#222222" text-anchor="middle" font-weight="bold">Human Evaluation</text>
      <text x="155.2" y="116.5" font-family="Helvetica, Arial, sans-serif"
            font-size="2" fill="#888888" text-anchor="middle">Helpfulness, safety, honesty</text>
      <text x="155.2" y="120.5" font-family="Helvetica, Arial, sans-serif"
            font-size="1.6" fill="#888888" text-anchor="middle" font-style="italic">[Import plot here]</text>
      <text x="175.1" y="137.0" font-family="Helvetica, Arial, sans-serif"
            font-size="1.3" fill="#AAAAAA" text-anchor="end">44×47 mm</text>
    </g>
  </g>
  <g id="flow-arrows" inkscape:groupmode="layer" inkscape:label="Flow Arrows">
    <line x1="27.9" y1="74.0" x2="27.9" y2="88.0" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <text x="23.9" y="81.7" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#444444" text-anchor="end" font-style="italic">Train</text>
    <line x1="91.6" y1="74.0" x2="91.6" y2="88.0" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <text x="87.6" y="81.7" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#444444" text-anchor="end" font-style="italic">Evaluate</text>
    <line x1="155.2" y1="74.0" x2="155.2" y2="88.0" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <text x="151.2" y="81.7" font-family="Helvetica, Arial, sans-serif" font-size="2" fill="#444444" text-anchor="end" font-style="italic">Assess</text>
    <line x1="52.7" y1="115.0" x2="66.7" y2="115.0" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
    <line x1="116.4" y1="115.0" x2="130.4" y2="115.0" stroke="#444444" stroke-width="0.5" marker-end="url(#arrow-accent)"/>
  </g>
